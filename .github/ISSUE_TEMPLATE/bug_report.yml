name: Bug Report
description: Report a defect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before submitting. Including your Mackit version and macOS version helps a lot with triage.
  - type: input
    id: version
    attributes:
      label: Mackit Version
      description: The version shown in Settings › About
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: macos
    attributes:
      label: macOS Version
      options:
        - macOS 15 or later
        - macOS 14
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Chip Architecture
      options:
        - Apple silicon (M series)
        - Intel
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What Happened
      description: What went wrong? What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce it reliably? e.g. scan → select the Xcode category → click Clean → …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs (optional)
      description: |
        A snippet from `log stream --predicate 'subsystem == "cn.mingcui.mackit"' --level info` (please redact private paths).
      render: shell
    validations:
      required: false
