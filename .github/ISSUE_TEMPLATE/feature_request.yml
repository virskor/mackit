name: Feature Request
description: Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before submitting. Suggestions for new scan rules and new categories are especially welcome — if you can, include the cache location and how it should be identified.
  - type: textarea
    id: problem
    attributes:
      label: Problem to Solve
      description: What pain point does this address? What do you do today without it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What interaction or behavior do you expect?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered (optional)
    validations:
      required: false
