name: 功能建议
description: 提出一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issue。新扫描规则、新分类的建议尤其受欢迎——如果方便，请附上该缓存的位置与判定依据。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个建议对应什么痛点？没有它时你是怎么做的？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你期望的交互或行为是怎样的？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
    validations:
      required: false
